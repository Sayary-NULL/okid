services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-okid}
      POSTGRES_USER: ${POSTGRES_USER:-okid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sayary-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-okid} -d ${POSTGRES_DB:-okid}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_HTTPS: ${DJANGO_HTTPS:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      POSTGRES_DB: ${POSTGRES_DB:-okid}
      POSTGRES_USER: ${POSTGRES_USER:-okid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: db
      POISKKINO_API_KEY: ${POISKKINO_API_KEY}
      SHIKIMORI_APP_NAME: ${SHIKIMORI_APP_NAME:-Sayary-SFL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    volumes:
      - mediafiles:/app/mediafiles
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sayary-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    volumes:
      - staticfiles:/var/www/static:ro
      - mediafiles:/var/www/media:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks:
      - sayary-network
    restart: unless-stopped

volumes:
  pgdata:
  mediafiles:
  staticfiles:

networks:
  sayary-network:
    name: sayary-network
    external: true
