# ============================================================================
# OKID subdomain vhost for the EXTERNAL (host-level) nginx.
#
# Insert this into the main nginx config (http{} context), e.g. drop it in
# /etc/nginx/sites-enabled/okid.conf or /etc/nginx/conf.d/okid.conf, then run:
#     nginx -t && systemctl reload nginx
#
# It terminates TLS for the subdomain and forwards everything to the frontend
# container, which serves the SPA and proxies /api, /admin, /static, /media
# to the backend. The stack is published on 127.0.0.1:8080 (HTTP_PORT in .env),
# so it does not conflict with the main site on 80/443.
#
# Replace okid.example.com and the certificate paths with your real values.
# ============================================================================

upstream okid_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name okid.example.com;

    # certbot --webroot (point root at your ACME webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # For nginx < 1.25.1 use instead: listen 443 ssl http2;
    http2 on;
    server_name okid.example.com;

    ssl_certificate     /etc/letsencrypt/live/okid.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/okid.example.com/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://okid_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
