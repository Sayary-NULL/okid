# Config for the nginx running INSIDE the frontend container.
# It serves the built SPA and proxies /api, /admin to the backend service,
# while serving /static and /media from the shared volumes.
#
# When the stack sits behind an external (host-level) nginx, that nginx
# terminates TLS and forwards to this one over HTTP, so forward the original
# scheme/real-IP instead of overwriting them.
map $http_x_forwarded_proto $okid_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_real_ip $okid_real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $okid_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $okid_forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $okid_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $okid_forwarded_proto;
    }

    location /static/ {
        alias /var/www/static/;
    }

    location /media/ {
        alias /var/www/media/;
    }

    client_max_body_size 50M;
}
